<script>
'use strict';

/* ================= Konfigurasi & data tetap ================= */
const CFG = window.CONFIG || {};
const NEGERI = ['Johor','Kedah','Kelantan','Melaka','Negeri Sembilan','Pahang','Perak','Perlis','Pulau Pinang',
  'Sabah','Sarawak','Selangor','Terengganu','W.P. Kuala Lumpur','W.P. Labuan','W.P. Putrajaya','Luar Negara'];
const L = {
  KEHADIRAN: { BOLEH: 'Boleh hadir', MUNGKIN: 'Mungkin', TIDAK: 'Tak dapat hadir' },
  KOMITMEN: { PASTI: 'Pasti datang', MUNGKIN: 'Mungkin datang', TIDAK_PASTI: 'Belum pasti' },
  BAJET: { BAWAH_300: 'Bawah RM300', '300_600': 'RM300 hingga RM600', '600_1000': 'RM600 hingga RM1,000', ATAS_1000: 'Atas RM1,000' },
  PASANGAN: { YA: 'Ya', TIDAK: 'Tidak' },
  BILIK: { TIDAK_PERLU: 'Tak perlu bilik', SINGLE: 'Bilik single', TWIN: 'Twin sharing', KELUARGA: 'Bilik keluarga' },
  BAJU: { XS: 'XS', S: 'S', M: 'M', L: 'L', XL: 'XL', '2XL': '2XL', '3XL': '3XL', '4XL': '4XL', '5XL': '5XL' }
};
const HARI = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
const BLN = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const BLN3 = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];

const IKON = {
  utama: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  tarikh: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  tempat: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  borang: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM8.5 11h7M8.5 15h5"/>',
  keputusan: '<path d="M3 20h18M6 17v-6M11 17V5M16 17v-9"/>',
  naik: '<path d="m6 15 6-6 6 6"/>',
  turun: '<path d="m6 9 6 6 6-6"/>',
  tick: '<path d="m5 12.5 4.5 4.5L19 7.5"/>'
};
const ikon = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IKON[n]}</svg>`;

/* ================= Keadaan ================= */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const S = {
  token: store.get('iku97_token'),
  data: null, view: 'login', tab: 'utama',
  pilihTarikh: new Set(), tiadaTarikh: false, susunTempat: [],
  keputusan: null, admin: null, adminTapis: 'semua', adminCari: '',
  prefill: null, daftarSelesai: null, sibuk: false, fokus: null, pasang: null, memuatK: false, memuatA: false
};

/* ================= Pembantu ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const tarikhPanjang = s => { const d = pd(s); return `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`; };

function julat(c) {
  const a = pd(c.mula), b = pd(c.tamat || c.mula);
  const hari = Math.round((b - a) / 864e5) + 1;
  let tajuk;
  if (hari <= 1) tajuk = `${a.getDate()} ${BLN3[a.getMonth()]}`;
  else if (a.getMonth() === b.getMonth()) tajuk = `${a.getDate()}–${b.getDate()} ${BLN3[b.getMonth()]}`;
  else tajuk = `${a.getDate()} ${BLN3[a.getMonth()]} – ${b.getDate()} ${BLN3[b.getMonth()]}`;
  const hariTeks = hari > 1 ? `${HARI[a.getDay()]} hingga ${HARI[b.getDay()]}, ${hari} hari` : HARI[a.getDay()];
  return { tajuk, tahun: b.getFullYear(), hariTeks };
}

function toast(msg, jenis) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'papar' + (jenis === 'ralat' ? ' ralat' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = ''; }, 3200);
}

async function api(action, payload = {}) {
  if (!CFG.API_URL || /PASTE|TAMPAL/.test(CFG.API_URL)) throw new Error('API_URL belum ditetapkan dalam config.js.');
  let res;
  try {
    res = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify({ action, token: S.token, ...payload }) });
  } catch (e) {
    throw new Error(navigator.onLine
      ? 'Tidak dapat menghubungi pelayan. Jika berterusan, maklumkan AJK.'
      : 'Tiada sambungan internet. Cuba lagi sebentar.');
  }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Pelayan tidak memberi respons yang sah. Semak API_URL dan deployment.'); }
  if (!j.ok) {
    if (j.code === 'AUTH') keluar(true);
    throw new Error(j.error || 'Ralat tidak diketahui.');
  }
  return j.data;
}

async function denganSibuk(btn, teks, fn) {
  if (S.sibuk) return;
  S.sibuk = true;
  const asal = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.textContent = teks; }
  try { return await fn(); }
  finally {
    S.sibuk = false;
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = asal; }
  }
}

function initDraf() {
  const d = S.data;
  const ut = d.undianSaya.tarikh || [];
  S.tiadaTarikh = ut.includes('TIADA');
  S.pilihTarikh = new Set(ut.filter(x => x !== 'TIADA'));
  const ids = d.calonTempat.map(c => c.id);
  const simpan = (d.undianSaya.tempat || []).filter(p => ids.includes(p.id)).map(p => ({ ...p }));
  const tiada = ids.filter(id => !simpan.some(p => p.id === id)).map(id => ({ id, kehadiran: '' }));
  S.susunTempat = simpan.concat(tiada);
}

async function muat() {
  try {
    S.data = await api('muat');
    store.set('iku97_data', S.data);
    initDraf();
    render();
  } catch (e) {
    if (!S.token) return;
    if (S.data) { render(); toast(e.message, 'ralat'); }
    else $('#app').innerHTML = `<main class="wrap"><div class="memuat"><p>${esc(e.message)}</p><button class="btn utama" data-act="cubaLagi">Cuba lagi</button></div></main>`;
  }
}

  return `<header class="kepala"><h1>Keputusan semasa</h1>
    <p>${st.undiTarikh} daripada ${st.alumni} alumni berdaftar sudah mengundi tarikh, dan ${st.undiTempat} sudah mengundi tempat.
    ${st.borneo} alumni berdaftar dari Sabah, Sarawak dan Labuan.</p>
    <small>Dikemas kini ${masa}.</small>
    <div class="baris-butang"><button class="btn kecil" data-act="muatKeputusan">Muat semula</button></div></header>
    <h2>Tarikh</h2>
    ${st.undiTarikh ? `<ul class="hasil-senarai">${tarikh}</ul>` : '<p>Belum ada undian tarikh.</p>'}
    <h2>Tempat</h2>
    <p><small>Pilihan pertama mendapat ${nTempat} mata, pilihan terakhir mendapat 1 mata.</small></p>
    ${st.undiTempat ? `<ul class="hasil-senarai">${tempat}</ul>` : '<p>Belum ada undian tempat.</p>'}
    <h2>Kaji selidik</h2>
    <p><small>${st.kajiSelidik} jawapan diterima.</small></p>
    <dl class="ringkas">
      <div><dt>Komitmen</dt><dd>${kiraTeks(k.kaji.komitmen, L.KOMITMEN)}</dd></div>
      <div><dt>Bajet seorang</dt><dd>${kiraTeks(k.kaji.bajet, L.BAJET)}</dd></div>
      <div><dt>Penginapan</dt><dd>${kiraTeks(k.kaji.bilik, L.BILIK)}</dd></div>
      <div><dt>Keluarga</dt><dd>${k.kaji.pasangan} akan bawa pasangan, ${k.kaji.anak} anak akan ikut</dd></div>
      <div><dt>Saiz baju</dt><dd>${kiraTeks(k.kaji.baju, L.BAJU)}</dd></div>
    </dl>
    ${d.undianDibuka && !kiraSiap().tarikh ? `<div class="baris-butang"><button class="btn utama" data-act="tab" data-tab="tarikh">Undi tarikh sekarang</button></div>` : ''}`;
}

/* ---------- Panel AJK ---------- */
const TAPIS = {
  semua: ['Semua', () => true],
  menunggu: ['Menunggu kelulusan', a => a.status === 'PENDING'],
  belumMasuk: ['Belum log masuk', a => a.status === 'AKTIF' && !a.logMasuk],
  belumSiap: ['Belum lengkap', a => a.status === 'AKTIF' && a.logMasuk && !(a.undiTarikh && a.undiTempat && a.kajiSelidik)],
  siap: ['Lengkap', a => a.undiTarikh && a.undiTempat && a.kajiSelidik]
};

function vAdmin() {
  if (!S.admin) { if (!S.memuatA) setTimeout(() => muatAdmin(), 0); return `<div class="memuat"><p>Memuatkan senarai alumni…</p></div>`; }
  const al = S.admin.alumni;
  const aktif = al.filter(a => a.status === 'AKTIF');
  return `<div class="baris-butang" style="margin-top:0"><button class="pautan" data-act="tab" data-tab="utama">Kembali ke halaman utama</button></div>
    <header class="kepala"><h1>Panel AJK</h1>
      <p>${aktif.length} alumni aktif. ${aktif.filter(a => a.logMasuk).length} sudah log masuk, ${aktif.filter(TAPIS.siap[1]).length} lengkap semua langkah, ${al.filter(TAPIS.menunggu[1]).length} menunggu kelulusan.</p>
      <div class="baris-butang"><button class="btn kecil" data-act="muatAdmin">Muat semula</button></div></header>
    <label class="medan"><span class="sr">Cari alumni</span><input type="search" data-in="cari" placeholder="Cari nama, negeri atau telefon" value="${esc(S.adminCari)}"></label>
    <div class="cip" role="group" aria-label="Tapis senarai">
      ${Object.entries(TAPIS).map(([k, [lbl, f]]) => `<button data-act="tapis" data-k="${k}" aria-pressed="${S.adminTapis === k}">${lbl} (${al.filter(f).length})</button>`).join('')}
    </div>
    <ul class="ahli-senarai" id="admin-list"></ul>`;
}

function appUrl() {
  const u = (S.admin && S.admin.appUrl) || CFG.APP_URL || '';
  return (u && !/USERNAME/.test(u)) ? u.replace(/\/?$/, '/') : location.origin + location.pathname;
}
function mesejJemputan(a) {
  return `Assalamualaikum & salam sejahtera ${a.nama}!\n\nKami sedang merancang ${S.admin.namaAcara || 'Reunion 30 Tahun IKU Bangsar Batch 1/97'}. Sila undi tarikh dan tempat yang sesuai untuk anda:\n\n${appUrl()}?p=${a.telefon}&k=${a.kod}\n\nKod akses anda: ${a.kod}\nTerima kasih!`;
}
function mesejPeringatan(a) {
  const belum = [!a.undiTarikh && 'undi tarikh', !a.undiTempat && 'undi tempat', !a.kajiSelidik && 'kaji selidik'].filter(Boolean);
  return `Salam ${a.nama}, peringatan mesra dari AJK Reunion IKU 1/97. Anda belum lengkapkan ${belum.join(', ')}. Hanya 2 minit:\n\n${appUrl()}?p=${a.telefon}&k=${a.kod}\n\nTerima kasih!`;
}

function renderAdminList() {
  const el = $('#admin-list');
  if (!el || !S.admin) return;
  const q = S.adminCari.trim().toLowerCase();
  const senarai = S.admin.alumni.filter(TAPIS[S.adminTapis][1])
    .filter(a => !q || `${a.nama} ${a.negeri} ${a.telefon}`.toLowerCase().includes(q));
  if (!senarai.length) { el.innerHTML = '<li><p>Tiada alumni dalam kategori ini.</p></li>'; return; }
  el.innerHTML = senarai.map(a => {
    let tindakan = '';
    if (a.status === 'PENDING') {
      tindakan = `<button class="btn kecil" data-act="luluskan" data-id="${esc(a.id)}">Luluskan</button>
        <button class="btn kecil" data-act="tolak" data-id="${esc(a.id)}">Tolak</button>`;
    } else if (a.status === 'AKTIF' && a.kod) {
      const lengkap = a.undiTarikh && a.undiTempat && a.kajiSelidik;
      if (!a.logMasuk) tindakan = `<a class="btn kecil wa" href="${waPautan(a.telefon, mesejJemputan(a))}" target="_blank" rel="noopener">Hantar jemputan</a>`;
      else if (!lengkap) tindakan = `<a class="btn kecil wa" href="${waPautan(a.telefon, mesejPeringatan(a))}" target="_blank" rel="noopener">Hantar peringatan</a>`;
      tindakan += `<button class="btn kecil" data-act="salin" data-kod="${esc(a.kod)}">Salin kod <span class="kod-papar">${esc(a.kod)}</span></button>`;
    } else if (a.status === 'AKTIF') {
      tindakan = '<small>Tiada kod. Jalankan menu "Jana kod akses" dalam Sheets.</small>';
    }
    const lenc = (ok, t) => `<span class="${ok ? 'ya' : ''}">${t}${ok ? ' selesai' : ''}</span>`;
    return `<li class="ahli">
      <b>${esc(a.nama)}</b>${a.peranan === 'ADMIN' ? ' <small style="display:inline">(AJK)</small>' : ''}
      <small>${esc(a.negeri || 'Negeri tidak diisi')}, ${esc(a.telefon)}</small>
      <div class="lencana">
        ${a.status !== 'AKTIF' ? `<span class="tunggu">${a.status === 'PENDING' ? 'Menunggu kelulusan' : esc(a.status)}</span>` : ''}
        ${a.status === 'AKTIF' ? `<span class="${a.logMasuk ? 'ya' : ''}">${a.logMasuk ? 'Pernah log masuk' : 'Belum log masuk'}</span>
          ${lenc(a.undiTarikh, 'Tarikh')}${lenc(a.undiTempat, 'Tempat')}${lenc(a.kajiSelidik, 'Kaji selidik')}` : ''}
      </div>
      ${tindakan ? `<div class="baris-butang">${tindakan}</div>` : ''}
    </li>`;
  }).join('');
}

/* ---------- Navigasi ---------- */
function vNav() {
  const siap = kiraSiap();
  const item = [['utama', 'Utama'], ['tarikh', 'Tarikh'], ['tempat', 'Tempat'], ['borang', 'Borang'], ['keputusan', 'Keputusan']];
  return `<nav class="nav" aria-label="Navigasi utama"><ul>${item.map(([k, l]) =>
    `<li><button data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${ikon(k)}<span>${l}</span>
      ${(k in siap && !siap[k] && S.data.undianDibuka) ? '<span class="titik" aria-label="belum selesai"></span>' : ''}</button></li>`).join('')}</ul></nav>`;
}

function render() {
  const app = $('#app');
  if (!S.token) { app.innerHTML = S.view === 'daftar' ? vDaftar() : vLogin(); return; }
  if (!S.data) { app.innerHTML = `<main class="wrap"><div class="memuat">${cop('besar')}<p>Memuatkan…</p></div></main>`; return; }
  const peta = { utama: vUtama, tarikh: vTarikh, tempat: vTempat, borang: vBorang, keputusan: vKeputusan, admin: vAdmin };
  app.innerHTML = `<main class="wrap">${(peta[S.tab] || vUtama)()}</main>${S.tab === 'admin' ? '' : vNav()}`;
  if (S.tab === 'admin') renderAdminList();
  if (S.fokus) {
    const f = document.querySelector(`[data-fk="${S.fokus}"]`);
    if (f && !f.disabled) f.focus({ preventScroll: true });
    S.fokus = null;
  }
}

/* ================= Tindakan ================= */
async function muatKeputusan(btn) {
  if (S.memuatK) return;
  S.memuatK = true;
  if (btn) { btn.disabled = true; btn.textContent = 'Memuatkan…'; }
  try {
    S.keputusan = await api('keputusan');
    if (S.tab === 'keputusan') render();
  } catch (e) {
    toast(e.message, 'ralat');
    if (!S.keputusan && S.tab === 'keputusan') {
      $('#app main').innerHTML = `<div class="memuat"><p>${esc(e.message)}</p><button class="btn utama" data-act="muatKeputusan">Cuba lagi</button></div>`;
    }
  } finally {
    S.memuatK = false;
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'Muat semula'; }
  }
}

async function muatAdmin(btn) {
  if (S.memuatA) return;
  S.memuatA = true;
  if (btn) { btn.disabled = true; btn.textContent = 'Memuatkan…'; }
  try {
    S.admin = await api('panelAdmin');
    if (S.tab === 'admin') render();
  } catch (e) {
    toast(e.message, 'ralat');
    if (!S.admin && S.tab === 'admin') {
      $('#app main').innerHTML = `<div class="memuat"><p>${esc(e.message)}</p><button class="btn utama" data-act="tab" data-tab="utama">Kembali</button></div>`;
    }
  } finally {
    S.memuatA = false;
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'Muat semula'; }
  }
}

const ACT = {
  ke(b) { S.view = b.dataset.view; S.daftarSelesai = null; render(); scrollTo(0, 0); },
  tab(b) {
    S.tab = b.dataset.tab;
    if (S.tab === 'keputusan') S.keputusan = null;
    render(); scrollTo(0, 0);
  },
  cubaLagi() { muat(); },
  keluar() { if (confirm('Log keluar dari app ini?')) keluar(); },

  togolTarikh(b) {
    const id = b.dataset.id;
    S.pilihTarikh.has(id) ? S.pilihTarikh.delete(id) : S.pilihTarikh.add(id);
    if (S.pilihTarikh.size) S.tiadaTarikh = false;
    S.fokus = b.dataset.fk; render();
  },
  togolTiada(b) {
    S.tiadaTarikh = !S.tiadaTarikh;
    if (S.tiadaTarikh) S.pilihTarikh.clear();
    S.fokus = b.dataset.fk; render();
  },
  async simpanTarikh(b) {
    try {
      await denganSibuk(b, 'Menyimpan…', async () => {
        const r = await api('undiTarikh', { tarikhIds: [...S.pilihTarikh] });
        S.data.undianSaya.tarikh = r.tarikh;
        store.set('iku97_data', S.data);
      });
      render(); toast('Undian tarikh disimpan.');
    } catch (e) { toast(e.message, 'ralat'); }
  },

  naik(b) { const i = +b.dataset.i; if (i > 0) { const a = S.susunTempat; [a[i - 1], a[i]] = [a[i], a[i - 1]]; } S.fokus = b.dataset.fk; render(); },
  turun(b) { const i = +b.dataset.i, a = S.susunTempat; if (i < a.length - 1) [a[i + 1], a[i]] = [a[i], a[i + 1]]; S.fokus = b.dataset.fk; render(); },
  hadir(b) { S.susunTempat[+b.dataset.i].kehadiran = b.dataset.k; S.fokus = b.dataset.fk; render(); },
  async simpanTempat(b) {
    try {
      await denganSibuk(b, 'Menyimpan…', async () => {
        const r = await api('undiTempat', { pilihan: S.susunTempat });
        S.data.undianSaya.tempat = r.tempat;
        store.set('iku97_data', S.data);
      });
      render(); toast('Undian tempat disimpan.');
    } catch (e) { toast(e.message, 'ralat'); }
  },

  anak(b) {
    const inp = $('input[name=bilAnak]');
    inp.value = Math.max(0, Math.min(10, (parseInt(inp.value, 10) || 0) + Number(b.dataset.d)));
  },

  muatKeputusan(b) { muatKeputusan(b); },
  muatAdmin(b) { muatAdmin(b); },
  tapis(b) { S.adminTapis = b.dataset.k; render(); },
  async luluskan(b) {
    try {
      await denganSibuk(b, 'Meluluskan…', async () => {
        const r = await api('luluskan', { id: b.dataset.id });
        const a = S.admin.alumni.find(x => x.id === r.id);
        Object.assign(a, { status: 'AKTIF', kod: r.kod });
      });
      render(); toast('Diluluskan. Tekan "Hantar jemputan" untuk hantar kod.');
    } catch (e) { toast(e.message, 'ralat'); }
  },
  async tolak(b) {
    if (!confirm('Tolak pendaftaran ini?')) return;
    try {
      await denganSibuk(b, 'Memproses…', async () => {
        const r = await api('tolak', { id: b.dataset.id });
        S.admin.alumni.find(x => x.id === r.id).status = 'DITOLAK';
      });
      render(); toast('Pendaftaran ditolak.');
    } catch (e) { toast(e.message, 'ralat'); }
  },
  async salin(b) {
    try { await navigator.clipboard.writeText(b.dataset.kod); toast('Kod disalin.'); }
    catch (e) { toast('Kod: ' + b.dataset.kod); }
  },

  profil() {
    const me = S.data.me, dlg = $('#dlg');
    dlg.innerHTML = `<form data-form="profil" novalidate>
      <h2 style="margin-top:0">Kemas kini profil</h2>
      <label class="medan"><span>Nama penuh</span><input name="nama" type="text" value="${esc(me.nama)}" required></label>
      <label class="medan"><span>Negeri bertugas atau menetap</span><select name="negeri">
        ${NEGERI.map(n => `<option ${n === me.negeri ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="medan"><span>Jawatan atau tempat bertugas</span><input name="jawatan" type="text" value="${esc(me.jawatan)}"></label>
      <label class="medan"><span>Emel</span><input name="emel" type="email" value="${esc(me.emel)}"></label>
      <p><small>Nombor telefon ${esc(me.telefon)} digunakan untuk log masuk. Hubungi AJK untuk menukarnya.</small></p>
      <p class="ralat" id="ralat-profil" role="alert"></p>
      <div class="baris-butang"><button class="btn utama" type="submit">Simpan profil</button>
      <button class="btn" type="button" data-act="tutupDlg">Batal</button></div></form>`;
    dlg.showModal();
  },
  tutupDlg() { $('#dlg').close(); },
  async pasang() {
    if (!S.pasang) return;
    S.pasang.prompt();
    await S.pasang.userChoice;
    S.pasang = null; render();
  }
};

const BORANG = {
  async login(f, btn) {
    const fd = new FormData(f), ralat = $('#ralat');
    ralat.textContent = '';
    try {
      await denganSibuk(btn, 'Menyemak…', async () => {
        const r = await api('login', { telefon: fd.get('telefon'), kod: String(fd.get('kod')).trim().toUpperCase() });
        S.token = r.token; store.set('iku97_token', r.token);
        store.set('iku97_tel', String(fd.get('telefon')).trim());
        store.set('iku97_kod', String(fd.get('kod')).trim().toUpperCase());
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        S.tab = 'utama'; S.prefill = null;
      });
      render(); await muat();
    } catch (e) { ralat.textContent = e.message; }
  },
  async daftar(f, btn) {
    const fd = Object.fromEntries(new FormData(f)), ralat = $('#ralat');
    ralat.textContent = '';
    if (!fd.nama || !fd.telefon || !fd.negeri) { ralat.textContent = 'Isi nama, nombor telefon dan negeri.'; return; }
    try {
      await denganSibuk(btn, 'Menghantar…', async () => {
        const r = await api('daftar', fd);
        S.daftarSelesai = { nama: fd.nama, noWaAjk: r.noWaAjk };
      });
      render(); scrollTo(0, 0);
    } catch (e) { ralat.textContent = e.message; }
  },
  async kaji(f, btn) {
    const fd = Object.fromEntries(new FormData(f)), ralat = $('#ralat');
    const wajib = { komitmen: 'tahap komitmen', bajet: 'bajet', bawaPasangan: 'bawa pasangan', jenisBilik: 'penginapan', saizBaju: 'saiz baju' };
    const tiada = Object.keys(wajib).filter(k => !fd[k]).map(k => wajib[k]);
    if (tiada.length) { ralat.textContent = 'Belum dijawab: ' + tiada.join(', ') + '.'; ralat.scrollIntoView({ block: 'center' }); return; }
    ralat.textContent = '';
    try {
      await denganSibuk(btn, 'Menyimpan…', async () => {
        await api('kajiSelidik', { jawapan: fd });
        S.data.kajiSelidik = { ...fd, bilAnak: Number(fd.bilAnak) || 0 };
        store.set('iku97_data', S.data);
      });
      S.tab = 'utama'; render(); scrollTo(0, 0); toast('Kaji selidik disimpan. Terima kasih!');
    } catch (e) { ralat.textContent = e.message; }
  },
  async profil(f, btn) {
    const fd = Object.fromEntries(new FormData(f));
    try {
      await denganSibuk(btn, 'Menyimpan…', async () => {
        const r = await api('kemaskiniProfil', fd);
        S.data.me = r.me; store.set('iku97_data', S.data);
      });
      $('#dlg').close(); render(); toast('Profil disimpan.');
    } catch (e) { $('#ralat-profil').textContent = e.message; }
  }
};

/* ================= Pendengar acara ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act];
  if (f) { e.preventDefault(); f(b, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const h = BORANG[f.dataset.form];
  if (h) h(f, f.querySelector('[type=submit]'));
});
document.addEventListener('input', e => {
  if (e.target.dataset.in === 'cari') { S.adminCari = e.target.value; renderAdminList(); }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.pasang = e; if (S.tab === 'utama' && S.data) render(); });
const semakTalian = () => { $('#luar-talian').hidden = navigator.onLine; };
window.addEventListener('online', semakTalian);
window.addEventListener('offline', semakTalian);

/* ================= Mula ================= */
(function mula() {
  semakTalian();
  const q = new URLSearchParams(location.search);
  if (q.has('daftar') && !S.token) { S.view = 'daftar'; history.replaceState(null, '', location.pathname); }
  if (q.get('k')) {
    S.prefill = { telefon: q.get('p') || '', kod: q.get('k') };
    history.replaceState(null, '', location.pathname);
  }
  if (S.token) {
    S.data = store.get('iku97_data');
    if (S.data) initDraf();
    render();
    muat();
  } else {
    render();
    if (S.prefill && S.prefill.telefon && S.prefill.kod) {
      const f = $('form[data-form=login]');
      BORANG.login(f, f.querySelector('[type=submit]'));
    }
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
